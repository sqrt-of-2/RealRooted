name = "RealRooted"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math"]
defaultTargets = ["RealRooted", "RealRooted.Production", "RealRooted.Tactic.Examples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "LeanLGV"
git = "https://github.com/PerAlexandersson/LeanLGV.git"
rev = "acf9f6694c1169e9773aaf9d1d594709c0926eb8"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "RealRooted"
